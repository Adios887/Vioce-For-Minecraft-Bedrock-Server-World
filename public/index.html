<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Proximity Voice Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e1e1e; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .step { display: none; }
        .step.active { display: block; }
        h2 { text-align: center; margin-top: 0; color: #4caf50; }
        .btn { width: 100%; padding: 12px; margin-top: 10px; background: #4caf50; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: #f44336; }
        .btn-secondary { background: #444; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; }
        .meter-box { width: 100%; background: #333; height: 15px; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .meter-bar { width: 0%; height: 100%; background: #4caf50; transition: width 0.1s; }
        .setting-group { margin: 15px 0; }
        .setting-group label { display: block; font-size: 14px; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="card">
    <!-- Step 1: เลือกโหมด -->
    <div id="step-1" class="step active">
        <h2>เลือกโหมดการเล่น</h2>
        <button class="btn" onclick="selectMode('world')">โลกปกติ (Local World)</button>
        <button class="btn btn-secondary" onclick="selectMode('server')">เซิร์ฟเวอร์ (Dedicated Server)</button>
    </div>

    <!-- Step 2: กรอกข้อมูลการเชื่อมต่อ -->
    <div id="step-2" class="step">
        <h2>กรอกข้อมูลการเชื่อมต่อ</h2>
        <div id="server-inputs" style="display:none;">
            <label>IP & Port เซิร์ฟเวอร์</label>
            <input type="text" id="input-ip" placeholder="เช่น 123.45.67.89:19132">
        </div>
        <label>รหัส 6 หลักจากในเกม</label>
        <input type="number" id="input-pin" placeholder="กรอกเลข 6 หลัก">
        <button class="btn" onclick="goToStep(3)">ถัดไป</button>
        <button class="btn btn-secondary" onclick="goToStep(1)">ย้อนกลับ</button>
    </div>

    <!-- Step 3: กรอกชื่อผู้เล่น -->
    <div id="step-3" class="step">
        <h2>ระบุชื่อในเกม</h2>
        <input type="text" id="input-name" placeholder="กรอกชื่อ Gamertag ของคุณ">
        <button class="btn" onclick="connectVoice()">เชื่อมต่อเลย</button>
        <button class="btn btn-secondary" onclick="goToStep(2)">ย้อนกลับ</button>
    </div>

    <!-- Step 4: Voice Control Dashboard -->
    <div id="step-4" class="step">
        <h2>Voice Control</h2>
        <p style="text-align:center; color:#aaa;" id="status-text">สถานะ: กำลังเชื่อมต่อ...</p>

        <!-- แถบระดับเสียงไมค์ -->
        <label>ระดับเสียงไมโครโฟนของคุณ:</label>
        <div class="meter-box"><div id="mic-bar" class="meter-bar"></div></div>

        <!-- ปุ่มเปิด/ปิดไมค์ -->
        <button id="btn-mute" class="btn" onclick="toggleMute()">เปิดไมโครโฟนอยู่</button>

        <!-- ปรับระดับเสียงไมค์ (Gain) -->
        <div class="setting-group">
            <label>ความดังไมโครโฟนส่งออก (Mic Gain)</label>
            <input type="range" id="gain-slider" min="0" max="200" value="100" oninput="updateGain(this.value)">
        </div>

        <!-- ปรับระดับเสียงได้ยิน (Master Output) -->
        <div class="setting-group">
            <label>ระดับเสียงคนอื่นที่ได้ยิน (Master Output)</label>
            <input type="range" id="volume-slider" min="0" max="100" value="100">
        </div>

        <!-- ปรับระยะพูด และ ระยะได้ยิน -->
        <div class="setting-group">
            <label>ระยะการพูด (Talk Range): <span id="talk-val">15</span>m</label>
            <input type="range" min="5" max="50" value="15" oninput="document.getElementById('talk-val').innerText=this.value">
        </div>
        <div class="setting-group">
            <label>ระยะการได้ยิน (Hearing Range): <span id="hear-val">20</span>m</label>
            <input type="range" min="5" max="50" value="20" oninput="document.getElementById('hear-val').innerText=this.value">
        </div>

        <button class="btn btn-danger" onclick="disconnectVoice()">Disconnect</button>
    </div>
</div>

<script>
    const socket = io();
    let currentMode = 'world';
    let isMuted = false;
    let micStream = null;
    let audioCtx, analyser, microphone, gainNode;

    function selectMode(mode) {
        currentMode = mode;
        document.getElementById('server-inputs').style.display = (mode === 'server') ? 'block' : 'none';
        goToStep(2);
    }

    function goToStep(stepNum) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(`step-${stepNum}`).classList.add('active');
    }

    // เชื่อมต่อเสียง + ตรวจสอบ PIN
    async function connectVoice() {
        const pin = document.getElementById('input-pin').value;
        const ipPort = document.getElementById('input-ip').value;
        const playerName = document.getElementById('input-name').value;

        if (!pin || pin.length !== 6) return alert("กรุณากรอกรหัส 6 หลักให้ถูกต้อง");
        if (!playerName) return alert("กรุณากรอกชื่อในเกม");

        // ส่งตรวจสอบ PIN ไปยัง Backend
        socket.emit('verify-pin', { mode: currentMode, pin, ipPort, playerName }, async (response) => {
            if (!response.success) {
                alert(response.error);
                return;
            }

            // เมื่อรหัสผ่าน ตรวจสอบไมโครโฟน
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                setupAudioAnalysis(micStream);
                
                document.getElementById('status-text').innerText = `เชื่อมต่อแล้วในชื่อ: ${playerName}`;
                document.getElementById('status-text').style.color = '#4caf50';
                goToStep(4);
            } catch (err) {
                alert("ไม่สามารถเข้าถึงไมโครโฟนได้ กรุณากดอนุญาตสิทธิ์บนเบราว์เซอร์");
            }
        });
    }

    // ระบบตรวจจับระดับเสียงไมโครโฟน (Audio Level Meter)
    function setupAudioAnalysis(stream) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        microphone = audioCtx.createMediaStreamSource(stream);
        gainNode = audioCtx.createGain();

        microphone.connect(gainNode);
        gainNode.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        function drawMeter() {
            if (isMuted) {
                document.getElementById('mic-bar').style.width = '0%';
            } else {
                analyser.getByteFrequencyData(dataArray);
                let avg = dataArray.reduce((a, b) => a + b) / dataArray.length;
                document.getElementById('mic-bar').style.width = Math.min(100, avg * 2) + '%';
            }
            requestAnimationFrame(drawMeter);
        }
        drawMeter();
    }

    // เปิด/ปิด ไมโครโฟน
    function toggleMute() {
        isMuted = !isMuted;
        if (micStream) {
            micStream.getAudioTracks()[0].enabled = !isMuted;
        }
        const btn = document.getElementById('btn-mute');
        btn.innerText = isMuted ? "ปิดไมโครโฟนอยู่" : "เปิดไมโครโฟนอยู่";
        btn.className = isMuted ? "btn btn-danger" : "btn";
    }

    // ปรับ Gain ไมโครโฟน
    function updateGain(value) {
        if (gainNode) {
            gainNode.gain.value = value / 100;
        }
    }

    // กด Disconnect
    function disconnectVoice() {
        if (micStream) {
            micStream.getTracks().forEach(track => track.stop());
        }
        socket.disconnect();
        window.location.reload();
    }

    // เมื่อโลกในเกมปิดลง
    socket.on('session-closed', (data) => {
        alert(data.reason);
        disconnectVoice();
    });
</script>

</body>
</html>
